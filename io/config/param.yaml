Params:
  task1:
    Joint:
      Start:
        Cspace:
          [0.002444781828671694, 0.07742192596197128, -1.2735952138900757, 0.02975347451865673, 1.1962307691574097, 0.010912355966866016]
      # 姿勢推定により設定するため、コメントアウト
      # PickPoint: 
      #   Cspace:
      #     [0.916, 0.724, -1.700, 0.001, 0.977, -0.67]
      #   Tspace: # [x, y, z, wx(optional), wy(optional), wz(optional), ww(optional)]
      #     [0.38435431684821103, 0.5008825942081249, 0.04786987646752977]
      PlacePoint:
        Cspace:
          [-0.724, 0.632, -1.553, 0.0, 0.921, 0.922]
        Tspace:
          [-0.38694509001475835, 0.5019096528287742, 0.04863467328972923, -0.6693602304811596, -0.7429375494123738, 0.000814498968426075, 0.0001269439897275006]
    StompParams:
      Start:
        'num_timesteps': 60
        'num_iterations': 60
        'num_iterations_after_valid': 10
        'num_rollouts': 30
        'max_rollouts': 30
        'initialization_method': 1
        'control_cost_weight': 0.1
        'stddev': [0.1, 0.25, 0.15, 0.5, 0.5, 0.4]
      PickPoint:
        Initial_Phase:  
          'num_timesteps': 75 # パスの時間ステップ数. この数値が多いほどパスの細かさが増し、滑らかなパスを生成しやすくなる.
          'num_iterations': 75 # STOMPアルゴリズムが実行する反復回数. 多いほど精度が向上する可能性があるが計算コストも増える.
          'num_iterations_after_valid': 10 # 有効なパス（障害物を回避したパス）が得られた後も追加で行う反復回数
          'num_rollouts': 25 # 各反復で生成されるロールアウトの数. 多いほど多様な候補パスを探索できるが、計算コストが増加する.
          'max_rollouts': 75 # 全体で生成可能なロールアウトの最大数. アルゴリズムが行き詰まるのを防ぐための上限.
          'initialization_method': 1 # パスの初期化方法を指定. 1はランダム初期化，その他の値で異なる初期化アルゴリズムが選択可能.
          'control_cost_weight': 0.0 # 制御コストの重み. この値を大きくすると、ロボットの動きが効率的かつスムーズになるようにパスを制約.
          'stddev': [0.1, 0.1, 0.4, 0.2, 0.4, 0.5] # 各ジョイントの探索時の標準偏差. 値が大きいほど広範囲を探索し、小さいほど局所的に調整.
        Implement_Phase:
          'num_timesteps': 8
          'num_iterations': 8
          'num_iterations_after_valid': 1
          'num_rollouts': 5
          'max_rollouts': 5
          'initialization_method': 1
          'control_cost_weight': 0.0
          'stddev': [0.01, 0.04, 0.04, 0.02, 0.04, 0.05]
      PlacePoint:
        Initial_Phase:
          'num_timesteps': 75
          'num_iterations': 75
          'num_iterations_after_valid': 10
          'num_rollouts': 25
          'max_rollouts': 75
          'initialization_method': 1
          'control_cost_weight': 0.0
          'stddev': [0.1, 0.1, 0.4, 0.2, 0.4, 0.5]
        Implement_Phase:
          'num_timesteps': 8
          'num_iterations': 8
          'num_iterations_after_valid': 1
          'num_rollouts': 5
          'max_rollouts': 5
          'initialization_method': 1
          'control_cost_weight': 0.0
          'stddev': [0.01, 0.04, 0.04, 0.02, 0.04, 0.05]
